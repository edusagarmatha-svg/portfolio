services:
  postgres:
    image: postgres:16
    container_name: portfolio-cms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio_cms
    ports:
      - "5433:5432"
    volumes:
      - portfolio_cms_pgdata:/var/lib/postgresql/data

volumes:
  portfolio_cms_pgdata: